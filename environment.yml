name: jeopardy-nlp
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - jupyterlab
  - ipykernel
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - tokenizers>=0.22,<1
      - torch==2.11.0+cu128; sys_platform == 'win32'
      - torch==2.11.0; sys_platform != 'win32'
      - faiss-cpu
      - sentence-transformers
      - transformers
      - sentencepiece
      - safetensors
      - datasets
